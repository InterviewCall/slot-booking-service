name: Deploy to production

# Push to main (the production branch): build an ARM64 image, push it to GitHub Container Registry,
# then SSH into the production server and run its deploy script (migrate, restart, health check, auto-rollback).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys of this service at the same time
concurrency:
  group: deploy-booking-service
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SERVICE: booking-service
  IMAGE_NAME: ic-booking-service

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "uri=ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The production server is ARM64 (AWS Graviton)
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the server (migrate, restart, health check, rollback on failure)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" "sudo /opt/ic-booking/bin/deploy.sh ${SERVICE} ${IMAGE}"
